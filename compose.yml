services:
  backend:
    build: .
    environment:
      DB_USER: eureka
      DB_PASSWORD: eureka
      DB_URL: "jdbc:postgresql://db:5432/eureka"
    profiles:
      - "prod"
    ports:
      - 8080:8080
    depends_on:
      - db

  db:
    image: postgres
    environment:
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: eureka
      POSTGRES_DB: eureka
    profiles:
      - "prod"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eureka']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-dev:
    image: postgres
    environment:
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: eureka
      POSTGRES_DB: eureka
    ports:
      - "5432:5432"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eureka']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
