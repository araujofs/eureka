<html
  lang="pt-br"
  xmlns:layout="http://www.ultraq.net.nz/web/thymealeaf/layout"
  layout:decorate="~{layout}"
>
  <div class="w-full max-w-6xl flex flex-col grow" layout:fragment="content">
    <div class="flex justify-between">
      <div class="mb-6 sm:mb-8">
        <h1
          class="font-[Sora,sans-serif] text-[1.6rem] sm:text-[2rem] font-semibold tracking-[-0.02em] text-[#1f2430]"
        >
          Corridas disponíveis
        </h1>
        <p class="text-[0.98rem] text-[#5a6270]">
          Escolha uma corrida para participar ou explorar.
        </p>
      </div>

      <div class="text-red-500">[[${errorMessage}]]</div>
    </div>
    <div
      th:if="${#lists.isEmpty(races)}"
      class="rounded-2xl border-2 border-dashed border-[#aab] bg-[#fbfbfd] p-8 text-center"
    >
      <p class="text-[#667085]">Ainda não há corridas cadastradas.</p>
    </div>

    <div
      th:if="${!#lists.isEmpty(races)}"
      class="grid gap-3 sm:gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"
    >
      <article
        th:each="race : ${races}"
        class="flex flex-col justify-between rounded-2xl border border-[#e6e8ee] bg-white p-5 sm:p-6 shadow-[0_10px_30px_rgba(31,36,48,0.06)] transition duration-300 ease-out hover:-translate-y-1 hover:border-[#c9ced9] hover:shadow-[0_18px_40px_rgba(31,36,48,0.12)]"
      >
        <div class="flex flex-col">
          <div class="flex items-start justify-between gap-4">
            <h2
              class="font-[Sora,sans-serif] text-[1.15rem] sm:text-[1.25rem] font-semibold text-[#1f2430]"
              th:text="${race.title}"
            ></h2>
            <div
              th:if="${race.active && race.played}"
              class="flex items-center gap-2"
            >
              <span class="h-2.5 w-2.5 rounded-full bg-indigo-600"></span>
              <span class="text-[0.8rem] font-semibold text-indigo-700"
                >Jogou</span
              >
            </div>
            <div
              th:if="${race.active && !race.played}"
              class="flex items-center gap-2"
            >
              <span class="h-2.5 w-2.5 rounded-full bg-[#22c55e]"></span>
              <span class="text-[0.8rem] font-semibold text-[#16a34a]"
                >Ativa</span
              >
            </div>
            <div th:unless="${race.active}" class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 rounded-full bg-[#f97316]"></span>
              <span class="text-[0.8rem] font-semibold text-[#ea580c]"
                >Inativa</span
              >
            </div>
          </div>

          <div class="flex flex-col gap-2">
            <p
              class="mt-3 text-[0.95rem] leading-relaxed text-[#4a5261] line-clamp-3"
              th:text="${race.description}"
            ></p>
            <span class="text-[0.9rem] font-semibold"
              >[[${race.questionsSize}]] pergunta(s)</span
            >
          </div>
        </div>
        <div
          class="mt-5 flex justify-end grow flex-col gap-3 text-[0.9rem] text-[#3f4552]"
        >
          <div class="flex items-center justify-between gap-3">
            <span
              class="inline-flex items-center gap-2 rounded-full bg-[#f1f3f7] px-3 py-1"
            >
              <span class="h-2 w-2 rounded-full bg-[#7d3f97]"></span>
              <span th:text="${race.duration} + 's'"></span>
            </span>

            <div class="flex justify-end gap-2">
              <a
                th:if="${session.admin}"
                th:href="@{/race/delete/{id}(id=${race.id})}"
                class="rounded-xl p-1 cursor-pointer border border-red-500 text-red-500 bg-red-50 flex items-center"
              >
                <iconify-icon
                  icon="material-symbols:delete-forever-outline-rounded"
                  width="24"
                  height="24"
                  noobserver
                ></iconify-icon>
              </a>

              <a
                th:if="${session.admin}"
                th:href="@{/question/add(raceId=${race.id})}"
                class="rounded-xl p-1 cursor-pointer border border-indigo-500 text-indigo-500 bg-indigo-50 flex items-center"
              >
                <iconify-icon
                  icon="material-symbols:indeterminate-question-box"
                  width="24"
                  height="24"
                  noobserver
                ></iconify-icon>
              </a>

              <a
                th:if="${session.admin}"
                th:href="@{/race/edit/{id}(id=${race.id})}"
                class="rounded-xl p-1 cursor-pointer border border-purple-500 text-purple-500 bg-purple-50 flex items-center"
              >
                <iconify-icon
                  icon="material-symbols:edit-outline-rounded"
                  width="24"
                  height="24"
                  noobserver
                ></iconify-icon>
              </a>

              <a
                th:href="@{/ranking/race/{id}(id=${race.id})}"
                class="rounded-xl p-1 cursor-pointer border border-amber-500 text-amber-600 bg-amber-50 flex items-center"
                th:if="${race.active}"
              >
                <iconify-icon
                  icon="material-symbols:trophy-outline"
                  width="24"
                  height="24"
                  noobserver
                ></iconify-icon>
              </a>

              <a
                th:href="@{/race/{id}/run/confirm(id=${race.id})}"
                class="rounded-xl p-1 cursor-pointer border border-emerald-500 text-emerald-600 bg-emerald-50 flex items-center"
                th:if="${race.active && !session.admin && !race.played}"
              >
                <iconify-icon
                  icon="material-symbols:play-arrow"
                  width="24"
                  height="24"
                  noobserver
                ></iconify-icon>
              </a>
            </div>
          </div>
        </div>
      </article>
    </div>
  </div>
</html>
