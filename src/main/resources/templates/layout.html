<!doctype html>
<html lang="pt-br" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout">
  <head th:replace="~{fragments/head :: head(${title})}"> </head>
  <body
    class="min-h-screen bg-[#f6f4fb] flex flex-col font-[Manrope,sans-serif] text-[#1f2430] antialiased"
  >
    <header
      class="h-16 sm:h-[72px] border-b border-[#1f24301f] bg-white px-4 sm:px-5 shadow-[0_2px_12px_rgba(31,36,48,0.04)] flex items-center justify-between"
    >
      <a th:href="@{/home}">
        <span
          class="font-[Sora,sans-serif] text-[1.2rem] sm:text-[1.35rem] font-bold lowercase tracking-[0.05em] text-[#7d3f97]"
          >eureka</span
        >
      </a>
      <div class="flex items-center gap-2">
        <a
          sec:authorize="hasRole('ADMIN')"
          th:href="@{/race/create}"
          class="inline-flex items-center gap-2 rounded-full border border-[#7d3f97] px-4 py-2 text-[0.85rem] font-semibold text-[#7d3f97] transition hover:bg-[#7d3f97] hover:text-white"
        >
          <svg
            class="h-4 w-4"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          Nova corrida
        </a>
        <a
          sec:authorize="isAuthenticated()"
          th:href="@{/ranking}"
          class="inline-flex items-center gap-2 rounded-full border border-[#1f24301f] px-4 py-2 text-[0.85rem] font-semibold text-[#1f2430] transition hover:bg-[#f1f3f7]"
        >
          Ranking
        </a>
        <form
          th:action="@{/auth/logout}"
          method="post"
        >
          <button
            type="submit"
            class="text-sm text-white font-semibold rounded-full bg-[#7d3f97] p-4 cursor-pointer"
          >
            Sair
          </button>
        </form>
      </div>
    </header>
    <main
      class="flex flex-1 min-h-0 justify-center px-4 sm:px-6 lg:px-10 py-8 sm:py-10 mb-12"
    >
      <div layout:fragment="content"></div>
    </main>
    <footer
      sec:authorize="${isAuthenticated()}"
      class="w-fit mb-0 flex justify-end p-3 fixed bottom-0 right-0"
    >
      <div
        class="py-2 px-3 rounded-full bg-white text-lg font-semibold border border-zinc-200"
      >
        Conectado como:
        <span sec:authentication="name" class="text-[#7d3f97]"></span>
      </div>
    </footer>
    <script layout:fragment="script">
      console.log("amo fred")
    </script>
  </body>
</html>
