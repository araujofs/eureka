<html lang="pt-br" layout:decorate="~{layout}" th:with="title='Entrar'">
  <form
    class="w-full max-w-lg rounded-[20px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    th:action="@{/race/delete/{id}(id=${raceId})}"
    th:method="delete"
    layout:fragment="content"
  >
    <h1
      class="m-0 mb-10 text-[1.9rem] font-extrabold leading-tight text-[#7d3f97] text-center"
    >
      Deseja deletar a corrida?
    </h1>
    <div class="flex justify-between p-2">
      <button
        class="cursor-pointer rounded-xl border-0 bg-[#bf5de4] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-white transition-all duration-200 ease-out hover:-translate-y-px hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
        type="submit"
      >
        Sim!
      </button>
      <a th:href="@{/home}">
        <button
          class="w-full cursor-pointer rounded-xl border-0 bg-[#ededea] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-black transition-all duration-200 ease-out hover:-translate-y-px hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
          type="button"
        >
          Não!
        </button>
      </a>
    </div>
  </form>
</html>
