<html lang="pt-br" layout:decorate="~{layout}" th:with="title='Criar corrida'">
  <section
    class="w-full max-w-lg rounded-[20px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    aria-label="Formulário de login"
    layout:fragment="content"
  >
    <h1
      class="m-0 text-[1.9rem] font-extrabold leading-tight text-[#7d3f97] text-center"
    >
      Cadastrar corrida
    </h1>
    <!-- <p class="mt-[0.55rem] mb-[1.7rem] text-[0.95rem] text-[#454f63]">Use apenas seu nome para acessar o sistema.</p> -->

    <div
      th:if="${errorMessage}"
      class="mb-4 rounded-[10px] border border-[#f5ca6ccc] bg-[#f5ca6c38] px-[0.85rem] py-3 text-[0.86rem] text-[#6f4a05]"
    >
      Houve um erro na criação da corrida. Tente novamente!
    </div>

    <form
      th:action="@{/race/create}"
      method="post"
      th:object="${race}"
      class="space-y-0"
    >
      <label for="title" class="mb-[0.55rem] block text-[0.92rem] font-bold"
        >Título</label
      >
      <input
        type="text"
        th:field="*{title}"
        placeholder="Digite o título da corrida"
        required
        class="w-full rounded-xl border border-[#1f243033] bg-white px-[0.95rem] py-[0.85rem] text-[0.98rem] mb-2 transition-[border-color,box-shadow] duration-200 ease-out placeholder:text-[#667085] focus:border-[#43bf8a] focus:outline-none focus:ring-[3px] focus:ring-[#6cf5ba47]"
      />
      <label
        for="description"
        class="mb-[0.55rem] block text-[0.92rem] font-bold"
        >Descrição</label
      >
      <textarea
        type="textarea"
        th:field="*{description}"
        placeholder="Digite a descrição da corrida"
        required
        class="w-full rounded-xl border border-[#1f243033] bg-white px-[0.95rem] py-[0.85rem] text-[0.98rem] mb-2 transition-[border-color,box-shadow] duration-200 ease-out placeholder:text-[#667085] focus:border-[#43bf8a] focus:outline-none focus:ring-[3px] focus:ring-[#6cf5ba47]"
      ></textarea>
      <label for="duration" class="mb-[0.55rem] block text-[0.92rem] font-bold"
        >Duração</label
      >
      <input
        type="number"
        th:field="*{duration}"
        placeholder="Digite a duração da corrida"
        required
        class="w-full rounded-xl border border-[#1f243033] bg-white px-[0.95rem] py-[0.85rem] text-[0.98rem] mb-2 transition-[border-color,box-shadow] duration-200 ease-out placeholder:text-[#667085] focus:border-[#43bf8a] focus:outline-none focus:ring-[3px] focus:ring-[#6cf5ba47]"
      />
      <button
        type="submit"
        class="mt-[1.1rem] w-full cursor-pointer rounded-xl border-0 bg-[#bf5de4] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-white transition-all duration-200 ease-out hover:-translate-y-px hover:bg-[#ab49d2] hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
      >
        Criar
      </button>
    </form>
  </section>
</html>
