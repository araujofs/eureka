<html
  lang="pt-br"
  layout:decorate="~{layout}"
  th:with="title='Corrida em andamento'"
>
  <section
    class="grid h-[calc(100vh-12rem)] w-full grid-rows-[auto_minmax(0,1fr)_auto] overflow-hidden rounded-[22px] border border-[#1f243014] bg-white p-4 shadow-[0_14px_28px_rgba(31,36,48,0.1)] sm:h-[calc(100vh-14.5rem)] sm:p-6"
    layout:fragment="content"
  >
    <h1
      class="m-0 line-clamp-2 text-[1.25rem] font-extrabold leading-tight text-[#7d3f97] sm:text-[1.55rem] lg:text-[1.75rem]"
      th:text="${question.statement}"
    >
      Pergunta atual
    </h1>

    <div class="grid h-full min-h-0 grid-cols-6 items-center gap-3 py-3 sm:gap-5 sm:py-5">
      <div
        class="col-span-1 flex size-16 items-center justify-center self-center justify-self-center rounded-full bg-[#7d3f97] text-2xl text-white sm:size-24 sm:text-4xl"
      >
        <span id="timer">0</span>
      </div>
      <div
        class="col-span-5 flex h-full min-h-0 w-full items-center justify-center overflow-hidden rounded-2xl bg-[#fbfbff]"
        th:if="${question.image != null}"
      >
        <img
          th:src="@{/api/question/{id}/image(id=${question.id})}"
          th:alt="${question.image.name}"
          class="block h-auto max-h-full max-w-full object-contain"
        />
      </div>
      <div
        class="col-span-5 flex h-full min-h-0 w-full items-center justify-center rounded-2xl border border-dashed border-[#cbd0dc] bg-[#fbfbff] px-4 text-center text-[0.92rem] font-semibold text-[#667085]"
        th:unless="${question.image != null}"
      >
        Sem imagem para esta pergunta
      </div>
    </div>

    <form
      th:action="@{/race/{id}/answer(id=${question.race.id})}"
      method="post"
      class="flex min-h-0 shrink-0 flex-col space-y-3"
      id="form"
    >
      <input type="hidden" name="resultId" th:value="${resultId}" />
      <input type="hidden" name="questionId" th:value="${question.id}" />

      <div class="grid w-full grid-cols-1 gap-2 sm:grid-cols-2 sm:grid-rows-2 sm:gap-3">
        <label
          th:each="answer, stat : ${question.answers}"
          class="flex min-h-0 items-center gap-2 rounded-xl border border-[#e6e8ee] bg-white px-3 py-2 text-[0.95rem] font-medium transition hover:border-[#c9ced9] hover:bg-[#f9f8fd] sm:px-4 sm:py-3 sm:text-[1rem]"
        >
          <input
            type="submit"
            name="answerIndex"
            class="h-8 w-0 accent-[#7d3f97] text-transparent"
            th:value="${stat.index}"
            required
            onchange="this.form.submit()"
          />
          <span class="break-words" th:text="${answer}">Resposta</span>
          <!-- <span th:text="${stat.index}">Resposta</span> -->
        </label>
      </div>
    </form>
  </section>
  <script layout:fragment="script" th:inline="javascript">
    let elapsedSeconds = /*[[${elapsedSeconds}]]*/ null;
    const raceDuration = /*[[${raceDuration}]]*/ null;

    const timer = document.querySelector("#timer");
    const form = document.querySelector("#form");
    timer.textContent = `${raceDuration - elapsedSeconds}`;

    setInterval(() => {
      elapsedSeconds++;

      if (elapsedSeconds >= raceDuration) {
        form.submit();
      }

      timer.textContent = `${raceDuration - elapsedSeconds}`;
    }, 1000);
  </script>
</html>
