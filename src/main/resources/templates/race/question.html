<html
  lang="pt-br"
  layout:decorate="~{layout}"
  th:with="title='Corrida em andamento'"
>
  <section
    class="w-full max-w-3xl rounded-[22px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    layout:fragment="content"
  >
    <div class="mb-6">
      <h1
        class="m-0 text-[1.7rem] sm:text-[1.9rem] font-extrabold leading-tight text-[#7d3f97]"
        th:text="${question.statement}"
      >
        Pergunta atual
      </h1>
      <p class="mt-2 text-[0.98rem] text-[#5a6270]">
        Escolha a alternativa correta para continuar.
      </p>
    </div>

    <form
      th:action="@{/race/{id}/answer(id=${question.race.id})}"
      method="post"
      class="mt-6 space-y-3"
    >
      <input type="hidden" name="resultId" th:value="${resultId}" />
      <input type="hidden" name="questionId" th:value="${question.id}" />

      <div class="space-y-3">
        <label
          th:each="answer, stat : ${question.answers}"
          class="flex items-start gap-3 rounded-xl border border-[#e6e8ee] bg-white px-4 py-3 text-[0.98rem] text-[#3f4552] transition hover:border-[#c9ced9] hover:bg-[#f9f8fd]"
        >
          <input
            type="radio"
            name="answerIndex"
            class="mt-1 h-4 w-4 accent-[#7d3f97]"
            th:value="${stat.index}"
            required
          />
          <span th:text="${answer}">Resposta</span>
          <!-- <span th:text="${stat.index}">Resposta</span> -->
        </label>
      </div>

      <button
        type="submit"
        class="mt-4 w-full cursor-pointer rounded-xl border-0 bg-[#bf5de4] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-white transition-all duration-200 ease-out hover:-translate-y-px hover:bg-[#ab49d2] hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
      >
        Confirmar resposta
      </button>
    </form>
  </section>
</html>
