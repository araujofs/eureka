<html lang="pt-br" layout:decorate="~{layout}" th:with="title='Resultado'">
  <section
    class="w-full max-w-4xl rounded-[22px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    layout:fragment="content"
  >
    <div
      class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
    >
      <div>
        <h1
          class="m-0 text-[1.7rem] sm:text-[1.9rem] font-extrabold leading-tight text-[#7d3f97]"
          th:text="${message}"
        >
          Resultado da corrida
        </h1>
        <p class="mt-2 text-[0.98rem] text-[#5a6270]">
          Veja sua pontuação e as respostas enviadas.
        </p>
      </div>
      <div class="flex justify-end gap-3">
        <div
          class="rounded-2xl border border-[#e6e8ee] bg-[#fbfbff] px-5 py-3 text-center"
        >
          <span class="block text-[0.85rem] font-semibold text-[#6b7280]">
            Tempo (s)
          </span>
          <span
            class="block text-[1.8rem] font-extrabold text-[#1f2430]"
            th:text="${time}"
            >0</span
          >
        </div>
        <div
          class="rounded-2xl border border-[#e6e8ee] bg-[#fbfbff] px-5 py-3 text-center"
        >
          <span class="block text-[0.85rem] font-semibold text-[#6b7280]">
            Pontos
          </span>
          <span
            class="block text-[1.8rem] font-extrabold text-[#1f2430]"
            th:text="${points}"
            >0</span
          >
        </div>
      </div>
    </div>

    <div
      th:if="${#lists.isEmpty(answers)}"
      class="rounded-2xl border-2 border-dashed border-[#aab] bg-[#fbfbfd] p-8 text-center"
    >
      <p class="text-[#667085]">Nenhuma resposta registrada.</p>
    </div>

    <div th:if="${!#lists.isEmpty(answers)}" class="space-y-4">
      <article
        th:each="answer : ${answers}"
        class="rounded-2xl border border-[#e6e8ee] bg-white p-5 sm:p-6"
      >
        <div class="flex items-start justify-between gap-4">
          <h2
            class="font-[Sora,sans-serif] text-[1.05rem] font-semibold text-[#1f2430]"
            th:text="${answer.question.statement}"
          ></h2>
          <span
            class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-[0.8rem] font-semibold"
            th:text="${answer.answerCorrect} ? 'Correta' : 'Incorreta'"
            th:classappend="${answer.answerCorrect} ? ' bg-[#ecfdf3] text-[#166534]' : ' bg-[#fff1f2] text-[#b42318]'"
          ></span>
        </div>

        <div class="mt-4 grid gap-2 sm:grid-cols-2">
          <div
            class="rounded-xl border border-[#e6e8ee] bg-[#fbfbff] px-4 py-3 text-[0.95rem] text-[#3f4552]"
          >
            <span class="block text-[0.78rem] font-semibold text-[#6b7280]">
              Sua resposta
            </span>
            <span
              th:text="${answer.question.answers[answer.answerIndex]}"
              class="mt-1 block font-semibold text-[#1f2430]"
            ></span>
          </div>
          <div
            class="rounded-xl border border-[#e6e8ee] bg-[#fbfbff] px-4 py-3 text-[0.95rem] text-[#3f4552]"
          >
            <span class="block text-[0.78rem] font-semibold text-[#6b7280]">
              Resposta correta
            </span>
            <span
              th:text="${answer.question.answers[answer.question.correctAnswer]}"
              class="mt-1 block font-semibold text-[#1f2430]"
            ></span>
          </div>
        </div>
      </article>
    </div>

    <a th:href="@{/home}" class="mt-6 block">
      <button
        type="button"
        class="w-full cursor-pointer rounded-xl border-0 bg-[#bf5de4] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-white transition-all duration-200 ease-out hover:-translate-y-px hover:bg-[#ab49d2] hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
      >
        Voltar para listagem de corridas
      </button>
    </a>
  </section>
</html>
