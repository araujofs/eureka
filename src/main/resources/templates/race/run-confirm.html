<html lang="pt-br" layout:decorate="~{layout}" th:with="title='Iniciar corrida'">
  <section
    class="w-full max-w-lg rounded-[20px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    layout:fragment="content"
  >
    <h1
      class="m-0 mb-4 text-[1.9rem] font-extrabold leading-tight text-[#7d3f97] text-center"
    >
      Pronto para iniciar?
    </h1>
    <p class="mb-8 text-center text-[0.98rem] text-[#5a6270]">
      Ao iniciar, você será levado para a primeira pergunta da corrida.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
      <form
        th:action="@{/race/{id}/run(id=${raceId})}"
        method="post"
        class="w-full"
      >
        <button
          type="submit"
          class="w-full cursor-pointer rounded-xl border-0 bg-[#bf5de4] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-white transition-all duration-200 ease-out hover:-translate-y-px hover:bg-[#ab49d2] hover:shadow-[0_10px_22px_rgba(208,108,245,0.32)]"
        >
          Iniciar corrida
        </button>
      </form>
      <a th:href="@{/home}" class="w-full">
        <button
          type="button"
          class="w-full cursor-pointer rounded-xl border-0 bg-[#ededea] px-4 py-[0.85rem] text-[0.98rem] font-extrabold tracking-[0.02em] text-black transition-all duration-200 ease-out hover:-translate-y-px hover:shadow-[0_10px_22px_rgba(31,36,48,0.08)]"
        >
          Voltar
        </button>
      </a>
    </div>
  </section>
</html>
