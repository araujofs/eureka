<html lang="pt-br" layout:decorate="~{layout}" th:with="title='Ranking'">
  <section
    class="w-full max-w-4xl rounded-[22px] self-center border border-[#1f243014] bg-white p-6 sm:p-8 shadow-[0_14px_28px_rgba(31,36,48,0.1)]"
    layout:fragment="content"
  >
    <div class="mb-6">
      <h1
        class="m-0 text-[1.7rem] sm:text-[1.9rem] font-extrabold leading-tight text-[#7d3f97]"
      >
        Ranking[[${race != null ? ' - ' + race.title : ''}]]
      </h1>
      <p class="mt-2 text-[0.98rem] text-[#5a6270]">
        Confira as pontua&ccedil;&otilde;es!
      </p>
    </div>

    <section
      class="mb-6 rounded-2xl border border-[#e6e8ee] bg-[#fbfbff] px-5 py-4"
      th:if="${ranking.currentRankDto != null and ranking.currentRankDto.ranking != null}"
    >
      <div
        class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <div>
          <span class="text-[0.85rem] font-semibold text-[#6b7280]"
            >Sua posi&ccedil;&atilde;o</span
          >
          <div
            class="mt-1 text-[1.6rem] font-extrabold text-[#1f2430]"
            th:text="${ranking.currentRankDto.ranking + 1}"
          >
            1
          </div>
        </div>
        <div th:if="${ranking.currentRankDto.answeredAt != null}">
          <span class="text-[0.85rem] font-semibold text-[#6b7280]"
            >Respondeu em</span
          >
          <div
            class="mt-1 text-[1.6rem] font-extrabold text-[#1f2430]"
            th:text="${#temporals.format(ranking.currentRankDto.answeredAt, 'dd/MM/yyyy')}"
          >
            1
          </div>
        </div>
        <div>
          <span class="text-[0.85rem] font-semibold text-[#6b7280]"
            >Seus pontos</span
          >
          <div
            class="mt-1 text-[1.6rem] font-extrabold text-[#1f2430]"
            th:text="${ranking.currentRankDto.points}"
          >
            0
          </div>
        </div>
      </div>
    </section>

    <section
      class="mb-6 rounded-2xl border border-[#e6e8ee] bg-[#fbfbff] px-5 py-4"
      th:if="${ranking.currentRankDto == null and not ranking.general}"
    >
      <div
        class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
      >
        <span>Você não jogou essa corrida!</span>
      </div>
    </section>

    <div
      th:if="${#lists.isEmpty(ranking.rank)}"
      class="rounded-2xl border-2 border-dashed border-[#aab] bg-[#fbfbfd] p-8 text-center"
    >
      <p class="text-[#667085]">Nenhum resultado registrado ainda.</p>
    </div>

    <div th:if="${!#lists.isEmpty(ranking.rank)}" class="space-y-3">
      <article
        th:each="userRank : ${ranking.rank}"
        class="rounded-2xl border border-[#e6e8ee] bg-white p-4 sm:p-5"
        th:classappend="${ranking.currentRankDto != null and userRank.ranking == ranking.currentRankDto.ranking} ? ' border-[#7d3f97] bg-[#f8f2fb]' : ''"
      >
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <span
              class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#f1f3f7] text-[0.95rem] font-bold text-[#3f4552]"
              th:text="${userRank.ranking + 1}"
            >
              1
            </span>
            <div>
              <span class="block text-[0.8rem] font-semibold text-[#6b7280]"
                >Posi&ccedil;&atilde;o</span
              >
              <span
                class="text-[0.95rem] font-semibold text-[#1f2430]"
                th:text="${userRank.userName}"
                >Jogador</span
              >
            </div>
          </div>
          <div>
            <span
              class="block text-[0.8rem] font-semibold text-[#6b7280]"
              th:if="${userRank.answeredAt != null and not ranking.general}"
              >Respondeu em</span
            >
            <span
              class="text-[0.95rem] font-semibold text-[#1f2430]"
              th:text="${#temporals.format(userRank.answeredAt, 'dd/MM/yyyy')}"
              >1</span
            >
          </div>
          <div class="text-right">
            <span class="block text-[0.78rem] font-semibold text-[#6b7280]"
              >Pontos</span
            >
            <span
              class="text-[1.05rem] font-extrabold text-[#1f2430]"
              th:text="${userRank.points}"
            >
              0
            </span>
          </div>
        </div>
      </article>
    </div>

    <nav
      th:if="${page != null and page.totalPages > 1}"
      class="mt-6 flex flex-col gap-3 rounded-2xl border border-[#e6e8ee] bg-[#fbfbff] px-4 py-3"
      aria-label="Paginação do ranking"
    >
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <span
          class="text-center text-[0.9rem] font-semibold text-[#4a5261] sm:text-left"
          th:text="|Página ${page.number + 1} de ${page.totalPages}|"
        >
          Página 1 de 1
        </span>

        <form
          method="get"
          th:action="${race != null} ? @{/ranking/race/{id}(id=${race.id})} : @{/ranking}"
          class="flex items-center justify-center gap-2"
        >
          <input type="hidden" name="page" value="1" />
          <label
            for="ranking-page-size"
            class="text-[0.86rem] font-semibold text-[#4a5261]"
            >Itens por página</label
          >
          <select
            id="ranking-page-size"
            name="size"
            onchange="this.form.submit()"
            class="rounded-xl border border-[#d8dce6] bg-white px-3 py-2 text-[0.88rem] font-bold text-[#3f4552] transition focus:border-[#43bf8a] focus:outline-none focus:ring-[3px] focus:ring-[#6cf5ba47]"
          >
            <option value="2" th:selected="${page.size == 2}">2</option>
            <option value="5" th:selected="${page.size == 5}">5</option>
            <option value="10" th:selected="${page.size == 10}">10</option>
          </select>
        </form>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-2">
        <span
          th:if="${page.first}"
          class="rounded-xl border border-[#d8dce6] bg-[#f1f3f7] px-4 py-2 text-[0.88rem] font-bold text-[#98a2b3]"
        >
          Anterior
        </span>
        <a
          th:unless="${page.first}"
          th:href="${race != null}
            ? @{/ranking/race/{id}(id=${race.id}, page=${page.number}, size=${page.size})}
            : @{/ranking(page=${page.number}, size=${page.size})}"
          class="rounded-xl border border-[#d8dce6] bg-white px-4 py-2 text-[0.88rem] font-bold text-[#3f4552] transition hover:bg-[#f1f3f7]"
        >
          Anterior
        </a>

        <th:block
          th:each="pageNumber : ${#numbers.sequence(1, page.totalPages)}"
        >
          <span
            th:if="${pageNumber == page.number + 1}"
            aria-current="page"
            class="inline-flex size-10 items-center justify-center rounded-xl border border-[#7d3f97] bg-[#7d3f97] text-[0.88rem] font-extrabold text-white shadow-[0_8px_18px_rgba(125,63,151,0.22)]"
            th:text="${pageNumber}"
          >
            1
          </span>
          <a
            th:unless="${pageNumber == page.number + 1}"
            th:href="${race != null}
              ? @{/ranking/race/{id}(id=${race.id}, page=${pageNumber}, size=${page.size})}
              : @{/ranking(page=${pageNumber}, size=${page.size})}"
            class="inline-flex size-10 items-center justify-center rounded-xl border border-[#d8dce6] bg-white text-[0.88rem] font-bold text-[#3f4552] transition hover:bg-[#f1f3f7]"
            th:text="${pageNumber}"
          >
            1
          </a>
        </th:block>

        <span
          th:if="${page.last}"
          class="rounded-xl border border-[#d8dce6] bg-[#f1f3f7] px-4 py-2 text-[0.88rem] font-bold text-[#98a2b3]"
        >
          Próxima
        </span>
        <a
          th:unless="${page.last}"
          th:href="${race != null}
            ? @{/ranking/race/{id}(id=${race.id}, page=${page.number + 2}, size=${page.size})}
            : @{/ranking(page=${page.number + 2}, size=${page.size})}"
          class="rounded-xl border border-[#d8dce6] bg-white px-4 py-2 text-[0.88rem] font-bold text-[#3f4552] transition hover:bg-[#f1f3f7]"
        >
          Próxima
        </a>
      </div>
    </nav>
  </section>
</html>
